
name: Docker CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-test:
    name: Docker Build and Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t price-calculator:ci .

      - name: Start container
        run: |
          docker run -d \
            --name price-calculator-ci \
            -p 127.0.0.1:3000:3000 \
            price-calculator:ci

      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs price-calculator-ci
          exit 1

      - name: Verify API
        run: |
          curl --fail --silent --show-error \
            'http://127.0.0.1:3000/api/prices/tax-included?price=1000&taxRate=0.10' \
            | grep -F '"taxIncludedPrice":1100'

      - name: Verify React page
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:3000/ \
            | grep -i '<html'

      - name: Show container logs on failure
        if: failure()
        run: docker logs price-calculator-ci

      - name: Stop container
        if: always()
        run: |
          docker rm -f price-calculator-ci || true
