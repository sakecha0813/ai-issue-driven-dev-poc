
name: Assign Issue to Copilot

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: read

jobs:
  assign-copilot:
    name: Assign Copilot Cloud Agent

    if: >-
      github.event.label.name == 'ai-ready' &&
      github.event.issue.state == 'open' &&
      github.actor == github.repository_owner

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check existing assignees
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          result=$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")

          if echo "$result" | jq -e \
            '.assignees[]? |
             select(.login == "copilot-swe-agent")' \
            > /dev/null; then
            echo "already_assigned=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_assigned=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assign Copilot
        if: steps.check.outputs.already_assigned == 'false'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            '{
              assignees: ["copilot-swe-agent[bot]"],
              agent_assignment: {
                target_repo: $repo,
                base_branch: "main",
                custom_instructions: "",
                custom_agent: "",
                model: ""
              }
            }' > /tmp/assignment.json

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/assignees" \
            --input /tmp/assignment.json

          echo "Copilot assignment requested."
