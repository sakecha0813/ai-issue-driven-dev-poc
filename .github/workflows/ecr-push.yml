
name: ECR Push

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ecr-push.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecr-push-main
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::755395261096:role/GitHubActionsEcrEcsDeployRole
          aws-region: ap-northeast-1
          role-session-name: github-ecr-push

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ai-issue-driven-dev-poc
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          IMAGE_TAG="${COMMIT_SHA}-${RUN_ID}-${RUN_ATTEMPT}"
          IMAGE_URI="${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

          echo "### Published Docker image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE_URI\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify pushed image
        run: |
          aws ecr describe-images \
            --repository-name ai-issue-driven-dev-poc \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].[imageDigest,imagePushedAt]' \
            --output table
